# Hemat RAM: VM build hanya punya ~1 GB bebas — heap + proxy daemon diatur
# lewat org.gradle.jvmargs di GRADLE_USER_HOME/gradle.properties (di luar
# repo), bukan di sini, supaya tidak menimpa pengaturan proxy daemon.
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
# Jangan unduh ulang toolchain Kotlin lewat Gradle (pakai yang dari plugin).
kotlin.daemon.jvm.options=-Xmx512m
android.nonTransitiveRClass=true
