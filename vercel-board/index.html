<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mihrab Connect Board</title>
    <script>
      /* Tema Board (?tema=gelap|terang|emas|biru-malam) — dipasang sebelum
         React render supaya tidak ada kedip tema. Tanpa param -> biru-malam
         (default, dipilih founder 23 Nov 2026). */
      (function () {
        var ok = { gelap: 1, terang: 1, emas: 1, "biru-malam": 1 };
        var t = "";
        try {
          t = new URLSearchParams(window.location.search).get("tema") || "";
        } catch (e) {
          t = "";
        }
        t = String(t).toLowerCase();
        if (!ok[t]) t = "biru-malam";
        document.documentElement.setAttribute("data-tema", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
